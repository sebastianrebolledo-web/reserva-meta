steps:
  # Construye la imagen del Frontend SIN build-args de API URL.
  # La URL del backend se inyecta en RUNTIME vía BACKEND_INTERNAL_URL al hacer el deploy en Cloud Run.
  # Esto evita tener que re-buildear la imagen cada vez que cambia la URL del backend.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tecfluid-vr-frontend'
      - '.'
    dir: 'frontend'

images:
  - 'gcr.io/$PROJECT_ID/tecfluid-vr-frontend'

# Tiempo máximo de build: 20 minutos (Next.js puede tardar en compilar)
timeout: '1200s'
