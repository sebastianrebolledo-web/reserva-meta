services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tecfluid_vr_backend
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      - DATABASE_URL=/app/data/metaquest.db
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - backend_data:/app/data
      - ./backend/.env:/app/.env:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: tecfluid_vr_frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  backend_data:
    driver: local
